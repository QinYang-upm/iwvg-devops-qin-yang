name: CD

on:
  push:
    branches: ['staging']

env:
  GHCR_URL: ghcr.io

jobs:
  cd:
    name: Build & Push GitHub Package & Deploy on Render Docker Image
    runs-on: ubuntu-22.04

    steps:

      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven


      - name: 🏷️ Extract artifact and version from pom
        run: |
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          echo "ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV


      # Convert GitHub repository name to lowercase
      # Docker repository names cannot contain uppercase letters
      - name: 🔽 Convert repository name to lowercase
        run: |
          echo "REPOSITORY=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV


      # Login to GitHub Container Registry
      #
      # Required GitHub Secret:
      # GHCR_PERSONAL_ACCESS_TOKEN
      #
      # Permissions:
      # repo
      # read:packages
      # write:packages
      # delete:packages

      - name: 📦 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}


      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_URL }}/${% raw %}${{ env.REPOSITORY }}{% endraw %}:${{ env.VERSION }}
            ${{ env.GHCR_URL }}/${% raw %}${{ env.REPOSITORY }}{% endraw %}:latest


      # Render Deploy Hook
      #
      # Required GitHub Secret:
      # RENDER_DEPLOY_HOOK_TOKEN
      #
      # Render:
      # Web Service
      # → Settings
      # → Deploy Hook

      - name: 🚀 Deploy on Render
        run: |
          curl --fail -X POST "https://api.render.com/deploy/${{ secrets.RENDER_DEPLOY_HOOK_TOKEN }}" \
          && echo "✅ Deployment succeeded" \
          || (echo "❌ Deployment failed" && exit 1)