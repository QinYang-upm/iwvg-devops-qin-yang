name: CD

on:
  push:
    branches: ['staging']

env:
  GHCR_URL: ghcr.io

jobs:
  cd:
    name: Build & Push GitHub Package & Deploy on Render Docker Image
    runs-on: ubuntu-22.04

    steps:

      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven


      - name: 🏷️ Extract artifact and version from pom
        run: |
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          echo "ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV


      - name: 🔽 Convert repository name to lowercase
        run: |
          echo "REPOSITORY=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV


      # GitHub Container Registry login
      #
      # Required secret:
      # GHCR_PERSONAL_ACCESS_TOKEN

      - name: 📦 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}


      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:${{ env.VERSION }}
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:latest


      # Render Deploy Hook
      #
      # Required secret:
      # RENDER_DEPLOY_HOOK_TOKEN

      - name: 🚀 Deploy on Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_TOKEN }}
          run: |
            curl --fail -X POST "$RENDER_DEPLOY_HOOK_TOKEN" \
            && echo "☑️ Deployment succeeded" \
            || (echo "❌ Deployment failed" && exit 1)